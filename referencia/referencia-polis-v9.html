<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Polis: gobierna el territorio</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya:wght@500;700;800&family=Alegreya+Sans:wght@400;500;700&family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E4EBE6; --panel:#F6F8F4; --ink:#22291F; --muted:#5C6656; --line:#C6D0C2;
  --llano:#C6D293; --bosque:#5E8A4D; --montana:#8E877A; --rio:#4D9AC1;
  --gold:#A8781F; --good:#2F7542; --bad:#B0402C; --accent:#2D5D72; --sel:#F2C94C;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#131A18; --panel:#1C2523; --ink:#E6ECE3; --muted:#9AA698; --line:#33403B;
    --llano:#6B7743; --bosque:#33563A; --montana:#5A564F; --rio:#2C6D90;
    --gold:#E2B24F; --good:#72BE80; --bad:#E57E66; --accent:#86BCD2; --sel:#E9C04A;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#131A18; --panel:#1C2523; --ink:#E6ECE3; --muted:#9AA698; --line:#33403B;
  --llano:#6B7743; --bosque:#33563A; --montana:#5A564F; --rio:#2C6D90;
  --gold:#E2B24F; --good:#72BE80; --bad:#E57E66; --accent:#86BCD2; --sel:#E9C04A;
  color-scheme:dark;
}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Alegreya Sans",system-ui,sans-serif;font-size:16px;line-height:1.45}
button{font:inherit;color:inherit}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:1000px;margin:0 auto;padding:14px 12px 40px}
header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:12px}
h1{font-family:Alegreya,Georgia,serif;font-weight:800;font-size:2.4rem;line-height:1;margin:0;letter-spacing:-.01em}
.era{font-family:Alegreya,Georgia,serif;font-size:1.1rem;color:var(--muted);margin-top:4px}
.era b{color:var(--ink)}
.hbtns{display:flex;gap:6px}
.ibtn{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 12px;cursor:pointer;font-size:.9rem}
.layout{display:grid;gap:14px}
@media(min-width:860px){.layout{grid-template-columns:minmax(0,1fr) 330px;align-items:start}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px}
.nums{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-bottom:10px}
.num{text-align:center}
.num strong{display:block;font-family:Alegreya,Georgia,serif;font-size:1.35rem;line-height:1.1}
.num span{font-size:.8rem;color:var(--muted)}
.gold{color:var(--gold)}
.neg{color:var(--bad)}
.bars{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px}
.bar{font-size:.85rem}
.bar .lab{display:flex;justify-content:space-between}
.track{height:7px;background:var(--line);border-radius:4px;overflow:hidden;margin-top:2px}
.fill{height:100%;border-radius:4px;transition:width .4s}
.goal{font-size:.85rem;color:var(--muted);margin-top:10px;border-top:1px dashed var(--line);padding-top:8px}
.map{display:grid;grid-template-columns:repeat(12,1fr);gap:2px;padding:3px;background:var(--line);border-radius:12px;margin-top:12px;touch-action:manipulation}
.tile{aspect-ratio:1;border:0;padding:0;display:grid;place-items:center;cursor:pointer;font-size:clamp(12px,3.5vw,24px);line-height:1;border-radius:3px;position:relative}
.t-llano{background:var(--llano)}
.t-bosque{background:var(--bosque)}
.t-montana{background:linear-gradient(135deg,var(--montana) 0 55%,color-mix(in srgb,var(--montana) 70%,#fff) 55% 100%)}
.t-rio{background:repeating-linear-gradient(160deg,var(--rio) 0 5px,color-mix(in srgb,var(--rio) 80%,#fff) 5px 7px);cursor:default}
.deco{opacity:.5;filter:saturate(.7)}
.tile.can{box-shadow:inset 0 0 0 2px var(--sel)}
.tile.dim{opacity:.55}
.tray{display:flex;gap:6px;overflow-x:auto;padding:10px 2px 4px;scrollbar-width:thin}
.tool{flex:0 0 auto;min-width:84px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 8px;cursor:pointer;text-align:center}
.tool .em{font-size:1.4rem;display:block}
.tool small{display:block;color:var(--muted);font-size:.78rem}
.tool.on{border-color:var(--sel);box-shadow:0 0 0 2px var(--sel)}
.tool:disabled{opacity:.45;cursor:not-allowed}
.hint{font-size:.85rem;color:var(--muted);min-height:1.3em;margin-top:4px}
h2{font-family:Alegreya,Georgia,serif;font-size:1.2rem;margin:0 0 8px}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:6px 0}
input[type=range]{width:100%;accent-color:var(--accent)}
.budget{width:100%;border-collapse:collapse;font-size:.92rem;margin:6px 0 10px}
.budget td{padding:3px 0;border-bottom:1px dotted var(--line)}
.budget td:last-child{text-align:right;font-variant-numeric:tabular-nums}
.budget tr.tot td{border-bottom:0;font-weight:700;padding-top:6px}
.btn{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:8px 12px;cursor:pointer}
.btn:disabled{opacity:.45;cursor:not-allowed}
.main{width:100%;background:var(--accent);color:var(--panel);border:0;border-radius:12px;padding:12px;font-family:Alegreya,Georgia,serif;font-size:1.15rem;font-weight:700;cursor:pointer;margin-top:8px}
.main:disabled{opacity:.5;cursor:not-allowed}
.two{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.log{max-height:260px;overflow:auto;font-size:.92rem}
.log p{margin:0 0 8px}
.log b{font-family:Alegreya,Georgia,serif}
.side{display:grid;gap:14px}
.overlay{position:fixed;inset:0;background:rgba(10,15,12,.55);display:none;align-items:flex-end;justify-content:center;z-index:10;padding:12px}
.overlay.show{display:flex}
@media(min-width:600px){.overlay{align-items:center}}
.card{background:var(--panel);color:var(--ink);border-radius:18px;max-width:520px;width:100%;max-height:88vh;overflow:auto;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));border:1px solid var(--line)}
.card .big{font-size:2.4rem;line-height:1}
.card h3{font-family:Alegreya,Georgia,serif;font-size:1.5rem;margin:6px 0 6px;line-height:1.15}
.card p{margin:0 0 12px}
.opt{display:block;width:100%;text-align:left;background:var(--bg);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
.opt small{display:block;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 12px}
.chip{font-size:.85rem;border-radius:999px;padding:2px 10px;border:1px solid var(--line)}
.chip.g{color:var(--good);border-color:var(--good)}
.chip.b{color:var(--bad);border-color:var(--bad)}
.phil{border-left:4px solid var(--accent);padding:6px 10px;margin:0 0 14px;background:var(--bg);border-radius:0 10px 10px 0}
.phil b{font-family:Alegreya,Georgia,serif}
.pbar{display:grid;grid-template-columns:120px 1fr 24px;gap:8px;align-items:center;font-size:.88rem;margin:4px 0}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--panel);padding:8px 14px;border-radius:10px;font-size:.92rem;opacity:0;transition:opacity .25s;pointer-events:none;z-index:20;max-width:90vw;text-align:center}
.toast.show{opacity:1}
@media (prefers-reduced-motion: reduce){.fill,.toast{transition:none}}

.small{font-size:.85rem;color:var(--muted);margin:6px 0 0}
.cls{display:grid;grid-template-columns:34px 1fr;gap:8px;align-items:center;margin:8px 0;font-size:.92rem}
.cls .ce{font-size:1.6rem;text-align:center}
.cls .lab{display:flex;justify-content:space-between}
.cls small{color:var(--muted);font-size:.8rem}
.macro{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;text-align:center;margin:10px 0 4px}
.macro strong{display:block;font-family:Alegreya,Georgia,serif;font-size:1.15rem}
.macro span{font-size:.75rem;color:var(--muted)}
.rA{color:var(--good)}.rB{color:var(--gold)}.rC{color:var(--bad)}
.four{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.txrow{display:grid;grid-template-columns:92px 1fr 40px;gap:8px;align-items:center;font-size:.92rem}
.guide{background:var(--bg);border:1px dashed var(--accent);border-radius:10px;padding:8px 10px;margin-bottom:8px;color:var(--ink)}
.lnk{background:none;border:0;color:var(--accent);text-decoration:underline;cursor:pointer;padding:0;font-size:.85rem}
.chk{display:flex;gap:8px;align-items:center;font-size:.92rem;margin-top:6px}
:root{--paper:#F1ECE0}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--paper:#E4DDCB}}
:root[data-theme="dark"]{--paper:#E4DDCB}
.mapbox{position:relative;margin-top:12px;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:var(--paper);height:clamp(300px,78vw,540px)}
#cv{width:100%;height:100%;display:block;touch-action:none;cursor:pointer}
.mapctl{position:absolute;right:8px;bottom:8px;display:flex;flex-direction:column;gap:6px}
.mapctl button{width:38px;height:38px;border-radius:50%;background:var(--panel);border:1px solid var(--line);font-size:1.15rem;cursor:pointer;line-height:1}
.tool img{width:48px;height:40px;display:block;margin:0 auto}
.ticon{width:96px;height:80px;display:block}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:6px}
.tab{background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:3px 10px;font-size:.85rem;cursor:pointer}
.tab.on{background:var(--accent);color:var(--panel);border-color:var(--accent)}
.chart{width:100%;height:auto;display:block}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .zero{stroke:var(--muted);stroke-dasharray:3 3}
.chart .ax{fill:var(--muted);font-size:10px;font-family:"Alegreya Sans",sans-serif}
.legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:.82rem;color:var(--muted);margin-top:4px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.vig{width:100%;height:auto;display:block;border-radius:12px;margin-bottom:6px}
.prev{display:block;margin-top:3px;color:var(--ink)}
.undo{margin-top:6px;font-size:.9rem}
.inp{font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);width:100%}
.chk .inp{width:110px}
.slot{display:grid;grid-template-columns:1fr auto auto;gap:6px;align-items:center;margin:6px 0;font-size:.92rem}
.achs{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.ach{border:1px solid var(--line);border-radius:10px;padding:6px 8px;opacity:.55;font-size:.88rem}
.ach.on{opacity:1;border-color:var(--gold)}
.ach small{display:block;color:var(--muted)}
.hud{position:absolute;left:8px;top:8px;right:8px;display:flex;flex-wrap:wrap;gap:6px;z-index:2;pointer-events:none}
.pill{display:flex;align-items:center;gap:4px;background:color-mix(in srgb,var(--panel) 82%,transparent);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:999px;padding:3px 10px 3px 5px;font-family:Alegreya,Georgia,serif;font-size:1.02rem;box-shadow:0 2px 6px rgba(40,40,20,.08)}
.pill small{font-family:"Alegreya Sans",sans-serif;font-size:.78rem;color:var(--muted)}
.ic{width:20px;height:20px;flex:none}
.tool small .ic{width:13px;height:13px;vertical-align:-2px;margin-right:2px}
.tool{background:linear-gradient(180deg,var(--panel),color-mix(in srgb,var(--panel) 85%,var(--gold)));}
img.ce{width:44px;height:44px;border-radius:50%;display:block}
.cls{grid-template-columns:48px 1fr}
.quote{font-style:italic;font-size:.84rem;color:var(--muted);margin-top:2px}
.stances{float:right;display:flex;gap:3px;margin-left:6px}
.st{display:flex;align-items:center;font-size:.8rem;font-weight:700}
.st img{width:24px;height:24px;border-radius:50%}
.st.pro{color:var(--good)}.st.con{color:var(--bad)}
.says{display:grid;gap:8px;margin:0 0 14px}
.say{display:grid;grid-template-columns:40px 1fr;gap:8px;align-items:center;font-size:.92rem}
.say img{width:40px;height:40px;border-radius:50%}
.say b{display:block;font-family:Alegreya,Georgia,serif}
.say.con span{color:var(--bad)}.say.pro span{color:var(--good)}
.ledger{position:relative;padding:4px 6px 4px 22px;border-radius:8px;background:repeating-linear-gradient(to bottom,transparent 0 25px,color-mix(in srgb,var(--accent) 20%,transparent) 25px 26px),color-mix(in srgb,var(--panel) 90%,#F4E9C8);margin:6px 0 10px}
.ledger::before{content:"";position:absolute;left:14px;top:0;bottom:0;width:1px;background:#C8553D;opacity:.6}
.ledger .budget{margin:0}
.ledger .budget td{border-bottom:0;height:26px;padding:0}
.ledger .budget td:last-child{font-family:Caveat,cursive;font-size:1.3rem;font-weight:700}
.card{background:linear-gradient(180deg,var(--panel),color-mix(in srgb,var(--panel) 92%,#E9DDB8));box-shadow:0 18px 40px rgba(20,25,15,.3)}
.cover{position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at center,color-mix(in srgb,var(--bg) 55%,transparent),color-mix(in srgb,var(--bg) 92%,transparent));backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px);padding:24px}
.cover[hidden]{display:none}
.cv-in{text-align:center;max-width:460px}
.cv-t{font-size:clamp(4rem,20vw,7.5rem);letter-spacing:-.02em;margin:0;line-height:.9;color:var(--ink);text-shadow:0 2px 0 color-mix(in srgb,var(--panel) 80%,transparent)}
.cv-s{font-family:Alegreya,Georgia,serif;font-size:1.2rem;color:var(--muted);margin:12px 0 22px}
.cv-b{display:grid;gap:8px}
.cv-b .btn{padding:11px}
.map, .tile{display:none}
:root{--regc:#2D5D72;--accent:var(--regc)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--accent:color-mix(in srgb,var(--regc) 55%,#fff)}}
:root[data-theme="dark"]{--accent:color-mix(in srgb,var(--regc) 55%,#fff)}
.panel{border-top:3px solid var(--accent)}
.emb{width:22px;height:22px;flex:none}
.regb{display:inline-flex;align-items:center;gap:5px;background:none;border:1px solid var(--accent);color:var(--ink);border-radius:999px;padding:2px 10px 2px 5px;cursor:pointer;font:inherit;margin-right:4px}
.regb b{color:var(--accent)}
.opt.reg{display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:start;border-left:4px solid var(--rc)}
.opt.reg .emb{width:28px;height:28px}
.regh{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;background:color-mix(in srgb,var(--rc) 18%,transparent);border:2px solid var(--rc)}
.regh .emb{width:38px;height:38px}
.rumbob{display:block;width:100%;grid-column:1/-1;background:none;border:0;padding:0;text-align:left;cursor:pointer;font:inherit;color:inherit;margin-top:2px}
.rumbo{height:12px;border-radius:6px;background:linear-gradient(90deg,var(--good),var(--gold),var(--bad));position:relative;margin:6px 0 2px}
.rumbo div{position:absolute;top:-3px;bottom:-3px;right:auto;border-right:3px solid var(--ink)}
.rlab{display:flex;justify-content:space-between;font-size:.8rem;color:var(--muted)}
.main{background:var(--accent)}

html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{background:var(--paper)}
#game{position:fixed;inset:0;overflow:hidden;background:var(--paper)}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:pointer}
.top{position:absolute;left:0;right:0;top:0;padding:calc(8px + env(safe-area-inset-top,0px)) 10px 6px;display:grid;gap:6px;z-index:3;pointer-events:none;background:linear-gradient(to bottom,color-mix(in srgb,var(--paper) 88%,transparent),transparent)}
.top>*{pointer-events:auto}
.row1{display:flex;align-items:center;justify-content:space-between;gap:8px}
.era{font-family:Alegreya,Georgia,serif;font-size:.98rem;color:var(--muted);margin:0;line-height:1.2}
.tbtns{display:flex;gap:6px}
.rb{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:color-mix(in srgb,var(--panel) 88%,transparent);cursor:pointer;font-size:1rem;display:grid;place-items:center}
.hud{position:static;display:flex;flex-wrap:wrap;gap:5px;pointer-events:none}
.meters{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.meters::-webkit-scrollbar{display:none}
.meters .bar,.meters .rumbob{flex:0 0 auto;min-width:92px;background:color-mix(in srgb,var(--panel) 85%,transparent);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:10px;padding:4px 8px;cursor:pointer;font-size:.78rem;margin:0}
.meters .rumbob{min-width:130px}
.meters .track{height:5px}
.mapctl{position:absolute;right:10px;top:50%;transform:translateY(-50%);bottom:auto;z-index:2}
.goalchip{position:absolute;left:10px;right:10px;bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:2;font-size:.84rem;color:var(--ink);background:color-mix(in srgb,var(--panel) 86%,transparent);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:12px;padding:6px 10px;max-height:4.4em;overflow:hidden;margin:0;border-top:1px solid var(--line)}
.goalchip .guide{margin:0 0 3px;padding:0;border:0;background:none}
.goalchip:empty{display:none}
.dock{position:absolute;left:0;right:0;bottom:0;z-index:5;display:flex;align-items:stretch;gap:2px;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--panel) 94%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-top:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.dock::-webkit-scrollbar{display:none}
.dk{flex:1 0 54px;background:none;border:0;border-radius:10px;cursor:pointer;font-size:.7rem;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:1px;padding:4px 2px}
.dk .di{font-size:1.3rem;line-height:1.2;display:grid;place-items:center;height:24px}
.dk .di svg{width:24px;height:24px}
.dk.on{background:color-mix(in srgb,var(--accent) 16%,transparent);color:var(--ink)}
.endb{flex:0 0 auto;background:var(--accent);color:#fff;border:0;border-radius:14px;padding:0 14px;font-family:Alegreya,Georgia,serif;font-weight:700;font-size:1rem;cursor:pointer;min-width:96px;line-height:1.1}
.endb:disabled{opacity:.5}
.sheet{position:absolute;left:0;right:0;bottom:calc(64px + env(safe-area-inset-bottom,0px));z-index:4;max-height:min(64dvh,560px);overflow:auto;background:var(--panel);border-top:3px solid var(--accent);border-radius:18px 18px 0 0;padding:4px 14px 16px;box-shadow:0 -10px 30px rgba(20,25,15,.18);transform:translateY(110%);transition:transform .28s ease;visibility:hidden}
.sheet.open{transform:none;visibility:visible}
.sheet.mini{max-height:none}
.sheet.mini .tray,.sheet.mini .sh-head{display:none}
.sh-head{display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:var(--panel);padding:8px 0 6px;z-index:1}
.sh-head h2{margin:0}
.x{width:32px;height:32px;border-radius:50%;border:1px solid var(--line);background:var(--bg);cursor:pointer}
@media(min-width:900px){
  .sheet{left:auto;right:12px;top:12px;bottom:calc(76px + env(safe-area-inset-bottom,0px));width:380px;max-height:none;border-radius:16px;border:1px solid var(--line);border-top:3px solid var(--accent);transform:translateX(115%)}
  .sheet.open{transform:none}
  .mapctl{right:auto;left:12px}
  .dock{left:50%;right:auto;transform:translateX(-50%);bottom:12px;border-radius:18px;border:1px solid var(--line);max-width:720px}
  .goalchip{left:50%;right:auto;transform:translateX(-50%);width:min(640px,90vw);bottom:94px}
}
.law{border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin:8px 0;display:grid;gap:4px}

  if(fx.f)S.food=Math.max(0,S.food+fx.f);
  if(fx.p)S.pop=clamp(S.pop+fx.p,1,Math.max(1,cap()));
  if(fx.h){S.sat.c=clamp(S.sat.c+fx.h,0,100);S.sat.a=clamp(S.sat.a+fx.h,0,100);S.sat.e=clamp(S.sat.e+fx.h,0,100)}
  if(fx.sc)S.sat.c=clamp(S.sat.c+fx.sc,0,100);
  if(fx.sa)S.sat.a=clamp(S.sat.a+fx.sa,0,100);
  if(fx.se)S.sat.e=clamp(S.sat.e+fx.se,0,100);
  if(fx.e)S.eq=clamp(S.eq+fx.e,0,100);
  if(fx.c)S.tr=clamp(S.tr+fx.c,0,100);
  if(fx.a)S.env=clamp(S.env+fx.a,0,100);
  if(fx.d)S.debt=Math.max(0,S.debt+fx.d);
  if(fx.i)S.shock+=fx.i/100;
  if(fx.txe)S.tx.e=clamp(S.tx.e+fx.txe,0,50);
  S.hap=calcHap();
  return fx;
}

// Avanza un año. Devuelve {stageUp, end:{win,title,text}|null}
function advance(){
  S.undo=[];
  const c=counts(),F=finance(),so=F.so,p0=S.pop,news=[];
  S.debt=Math.max(0,S.debt+F.interest-F.pay);
  if(F.mat)news.push(`Venció un bono: pagaste ${F.mat} de capital.`);
  S.bonds=S.bonds.filter(b=>b.due>S.year);
  S.gold+=F.net;S.rev=F.rev;
  S.food+=F.fprod-F.cons;
  let hunger=false;
  if(S.stage>=1&&S.pop>waterCap(c))news.push(`Falta agua: ${S.pop} habitantes y acueductos para ${waterCap(c)}.`);
  if(S.food<0){hunger=true;S.hungry=true;S.pop-=Math.ceil(S.pop*.12);S.food=0;news.push('Faltó alimento: hubo hambre y se perdieron vidas.')}
  const cp=c.casa*10;
  const wcap=waterCap(c);
  if(!hunger&&S.pop<cp&&S.pop<wcap)S.pop=Math.min(cp,S.pop+Math.max(1,Math.round(S.pop*.18*S.hap/60)));
  if(S.pop>cp)S.pop=cp;
  if(S.hap<25){S.pop-=Math.ceil(S.pop*.06);news.push('El descontento empuja a familias a irse.')}
  S.pop=Math.max(0,S.pop);
  // inflación
  const tI=.02+RM('infl')+(hasLaw('bancoCentral')?-.015:0)+(hasLaw('arancel')?.005:0)+S.issue/Math.max(50,F.rev)*.25+(S.gold<0?.03:0)+(hunger?.04:0)-c.banco*.01+S.shock;
  S.infl=clamp(S.infl*.4+tI*.6,-.02,.6);S.shock*=.5;S.issue=0;S.price*=1+S.infl;
  if(S.infl>.08)news.push(`La inflación llegó a ${Math.round(S.infl*100)}%.`);
  // satisfacción por clase
  const TG=satTargets(c,hunger),tSC=TG.c,tSA=TG.a,tSE=TG.e,sc=TG.sc,expc=TG.expc,ip=S.infl*100;
  S.sat.c=clamp(S.sat.c+(tSC-S.sat.c)*.35,0,100);
  S.sat.a=clamp(S.sat.a+(tSA-S.sat.a)*.35,0,100);
  S.sat.e=clamp(S.sat.e+(tSE-S.sat.e)*.35,0,100);
  const so2=society();
  S.hap=calcHap(so2);
  if(S.sat.e<25){S.eliteMood=Math.max(.4,S.eliteMood-.3);news.push('Fuga de capitales: parte de la élite se va con su dinero.')}
  else if(S.sat.e>45)S.eliteMood=Math.min(1,S.eliteMood+.1);
  // igualdad
  const tot=(F.post.c+F.post.a+F.post.e+F.post.u)||1,es=F.post.e/tot,ps=so.el/Math.max(1,so.P);
  const tE=85-(es-ps)*120+sc*10+c.universidad*5+RM('eq')+(hasLaw('educacion')?8:0)+(hasLaw('censura')?-3:0);
  S.eq=clamp(S.eq+(tE-S.eq)*.3,0,100);
  // confianza
  const tT=50+RM('tr')+(hasLaw('censura')?6:0)+(hasLaw('prensa')?-3:0)+(S.hap-50)*.4+c.agora*10+(S.gold<0?-10:0)-Math.max(0,ip-3)*.8;
  S.tr=clamp(S.tr+(tT-S.tr)*.3,0,100);
  if(S.sat.c<25||S.sat.a<25){if(RM('silence',false)){S.corr=clamp(S.corr+4,0,100);news.push('La guardia disolvió protestas. Nadie habla, pero el descontento crece.')}else{S.tr=clamp(S.tr-5,0,100);news.push(S.sat.c<25?'Protestas campesinas en los caminos.':'Protestas de artesanos en la plaza.')}}
  // ambiente
  const tA=envTarget(c);
  S.env=clamp(S.env+(tA-S.env)*.3,0,100);
  // déficit y cesación de pagos
  S.deficit=F.net<0?S.deficit+1:0;
  if(F.net<0)news.push(`El presupuesto cerró con déficit de ${-F.net} de oro.`);
  if(S.gold<0&&S.deficit>=2){S.tr=clamp(S.tr-8,0,100);news.push('Años en rojo: el pueblo duda de tu manejo.')}
  if(S.gold<-150){
    S.defaults++;
    if(S.defaults>=2){S.log.unshift({y:S.year,t:news.join(' ')});return {end:{win:false,title:'Bancarrota',text:'Segunda cesación de pagos. Nadie vuelve a prestarle al territorio.'}}}
    S.debt=Math.round(S.debt/2);S.bonds.forEach(b=>b.amt=Math.round(b.amt/2));S.gold=0;S.tr=clamp(S.tr-20,0,100);
    S.sat.c-=10;S.sat.a-=10;S.sat.e-=15;
    news.push('Cesación de pagos: reestructuraste la deuda a la mitad. Tu calificación se desploma.');
  }
  // promesas
  S.promises=S.promises.filter(pr=>{
    if(counts()[pr.k]>pr.base){S.kept++;S.corr=clamp(S.corr-5,0,100);S.tr=clamp(S.tr+8,0,100);S.sat.c+=4;S.sat.a+=4;news.push(`Cumpliste tu promesa: ${B[pr.k].a}. El pueblo lo celebra.`);return false}
    if(S.year>=pr.dl){S.corr=clamp(S.corr+8,0,100);S.tr=clamp(S.tr-15,0,100);news.push(`Promesa incumplida: no construiste ${B[pr.k].a}.`);return false}
    return true;
  });
  const d=S.pop-p0;
  if(d>0)news.push(`Llegaron ${d} habitantes.`);else if(d<0)news.push(`La población bajó en ${-d}.`);
  let stageUp=false;const nx=STAGES[S.stage+1];
  if(nx&&nx.ok(counts())){S.stage++;stageUp=true;news.push(`El territorio ahora es ${STAGES[S.stage].n}.`)}
  if(RM('elect',false)&&S.stage>=1&&S.stage<3&&S.year%4===0){
    const th=34;if(S.tr<th){S.log.unshift({y:S.year,t:news.join(' ')});return {end:{win:false,title:'Perdiste las elecciones',text:`El pueblo votó por otro proyecto: la confianza estaba en ${Math.round(S.tr)} y necesitabas ${th}.`}}}
    news.push('Hubo elecciones y el pueblo renovó tu mandato.');S.tr=clamp(S.tr+3,0,100);
  }
  if(S.stage===3){
    S.polisYears++;
    if(!stageUp&&S.polisYears%4===0&&!RM('elect',false)&&S.tr<D().elec){
      S.polisYears=0;S.corr=clamp(S.corr+20,0,100);S.tr=clamp(S.tr-5,0,100);
      news.push(`El pueblo niega su apoyo al ${RG().t.toLowerCase()}: sin elecciones, la legitimidad se mide en la calle. La cuenta de años como Polis vuelve a cero.`);
    }
    if(!stageUp&&S.polisYears%4===0&&RM('elect',false)){
      if(S.tr<D().elec){S.log.unshift({y:S.year,t:news.join(' ')});return {end:{win:false,title:'Perdiste las elecciones',text:'El pueblo votó por otro proyecto. La confianza no alcanzó.'}}}
      S.tr=clamp(S.tr+5,0,100);news.push('Ganaste las elecciones: el pueblo renueva tu mandato.');
    }
  }
  // rumbo del gobierno: corrupción, reforma y revolución
  const minSat=Math.min(S.sat.c,S.sat.a,S.sat.e);
  S.corr=clamp(S.corr+RM('drift')+(hasLaw('censura')?1.5:0)-(hasLaw('prensa')?1.5:0),0,100);
  if(minSat<25)S.corr=clamp(S.corr+3,0,100);
  if(minSat>50&&S.tr>55)S.corr=clamp(S.corr-2,0,100);
  S.regChange=null;
  if(RG().rect&&S.corr>=70){const from=S.reg;S.reg=RG().cor;S.corr=45;S.regChange={type:'cor',from,to:S.reg};news.push(`El gobierno se corrompió: ${REG[from].n} se volvió ${REG[S.reg].n}.`)}
  else if(!RG().rect){
    const nx=RG().cyc;
    if(S.corr<=20){const from=S.reg;S.reg=Object.keys(REG).find(k=>REG[k].cor===from&&REG[k].rect)||nx;S.corr=35;S.regChange={type:'ref',from,to:S.reg};news.push(`Reformaste el gobierno: ${REG[from].n} vuelve a ser ${REG[S.reg].n}.`)}
    else if((S.tr<(S.reg==='tirania'?40:30)||minSat<22)&&Math.random()<(S.reg==='tirania'?.6:.45)){const from=S.reg;S.reg=nx;S.corr=25;S.tr=clamp(S.tr+15,0,100);S.gold=Math.round(S.gold*.6);S.pop=Math.round(S.pop*.92);if(S.stage===3)S.polisYears=0;['c','a','e'].forEach(k=>S.sat[k]=clamp(S.sat[k]+8,0,100));S.regChange={type:'rev',from,to:S.reg};news.push(`¡Revolución! Cae ${REG[from].n} y nace ${REG[S.reg].n}.`)}
  }
  if(S.reg==='monarquia'&&S.year%15===0){if(Math.random()<.5){S.corr=clamp(S.corr-10,0,100);S.tr=clamp(S.tr+5,0,100);news.push('Sucesión en la corona: el heredero es prudente y querido.')}else{S.corr=clamp(S.corr+15,0,100);S.tr=clamp(S.tr-5,0,100);news.push('Sucesión en la corona: el heredero es caprichoso y la corte murmura.')}}
  if(RM('eliteCap',0)&&S.tx.e>RM('eliteCap',0))S.tx.e=RM('eliteCap',0);
  S.tx0={...S.tx};
  S.expc=Math.round(expc);
  S.hist.push({y:S.year,pop:S.pop,gold:Math.round(S.gold),debt:Math.round(totDebt()),eq:Math.round(S.eq),hap:Math.round(S.hap),tr:Math.round(S.tr),env:Math.round(S.env),infl:+(S.infl*100).toFixed(1)});
  S.log.unshift({y:S.year,t:news.join(' ')||'Un año tranquilo.'});
  if(S.log.length>60)S.log.pop();
  if(S.tr<=5)return {end:{win:false,title:'Revuelta popular',text:'El pueblo perdió toda confianza y tomó la plaza.'}};
  if(S.env<=5)return {end:{win:false,title:'Colapso ecológico',text:'El río y la tierra ya no sostienen la vida.'}};
  if(S.pop<=3)return {end:{win:false,title:'Territorio abandonado',text:'Las últimas familias se marcharon.'}};
  if(S.polisYears>=D().polis)return {end:{win:true,title:'Tu Polis perdura',text:`Sostuviste ${D().polis} años un gobierno del pueblo y para el pueblo.`}};
  if(S.vis&&S.vis.y<=S.year)S.vis=null;
  S.year++;
  if(!stageUp)S.pend=drawEvent();
  return {stageUp,end:null};
}

function drawEvent(){
  const due=S.later.findIndex(l=>l.y<=S.year);
  if(due>=0){
    const l=S.later.splice(due,1)[0],L=LATER[l.id];
    return {id:l.id,e:L.e,title:L.title,text:`${L.text} Es consecuencia de lo que decidiste en el año ${l.from}.`,followUp:true,
      opts:[{l:'Asumir las consecuencias',fx:L.fx,f:null,why:L.why}]};
  }
  if(S.year<3||Math.random()>D().evp)return null;
  if(S.stage>=1&&S.promises.length===0&&Math.random()<.2)return petition();
  const c=counts();
  const pool=EV.filter(e=>S.stage>=e.st&&(!e.cond||e.cond(c))&&!S.recent.includes(e.id));
  if(!pool.length)return null;
  const e=pool[rnd(pool.length)];
  S.recent.push(e.id);if(S.recent.length>7)S.recent.shift();
  return {id:e.id,e:e.e,title:e.title,text:e.text,opts:e.opts};
}
function petition(){
  const ks=['escuela','hospital','parque','mercado','agora','universidad'].filter(k=>B[k].st<=S.stage);
  const k=ks[rnd(ks.length)];
  return {id:'pet',e:'✍️',title:`El pueblo pide ${B[k].a}`,text:'Una asamblea de vecinos te entrega una petición firmada. Si lo prometes, tendrás 3 años para cumplir.',opts:[
    {l:'Prometerlo',fx:{c:6},f:'deon',why:'Una promesa pública obliga. Cumplirla construye confianza; romperla la destruye.',promise:k},
    {l:'Explicar que ahora no hay recursos',fx:{c:-5,sc:-2,sa:-2},f:'virt',why:'La franqueza cuesta un poco hoy, pero no hipoteca tu palabra.'},
    {l:'Ignorar la petición',fx:{c:-8,sc:-3,sa:-3},f:'real',why:'Gobernar sin escuchar es gobernar en nombre del pueblo, no para él.'}]};
}
const VIS={crecida:[['flood'],['flood'],['flood']],crecida_mal:[['flood']],sequia:[['drought'],['drought'],['drought']],
  festival:[['festival'],['festival'],null],protesta:[['crowd'],['crowd'],['crowd']],huelga:[['crowd'],['crowd'],['crowd']],
  tierras_mal:[['crowd']],protesta_mal:[['crowd']],humo:[null,null,['smog']],humo_mal:[['smog']],plaga:[['pests'],null,['pests']],
  oro_mal:[['poison']],pet:[['crowd'],null,['crowd']],precios:[['crowd'],null,['crowd']]};
function choose(i){
  const ev=S.pend,o=ev.opts[i];
  const vv=VIS[ev.id]&&VIS[ev.id][i];if(vv)S.vis={k:vv[0],y:S.year};
  const real=applyFx(o.fx);if(o.f){S.phil[o.f]++;S.corr=clamp(S.corr+(o.f==='real'?9:o.f==='util'?1:-4),0,100)}
  if(o.promise)S.promises.push({k:o.promise,base:counts()[o.promise],dl:S.year+3});
  if(o.later&&(o.later[2]===undefined||Math.random()<o.later[2]))S.later.push({y:S.year+o.later[0],id:o.later[1],from:S.year});
  S.log.unshift({y:S.year,t:ev.followUp?`${ev.title}.`:`${ev.title}. Decidiste: ${o.l.toLowerCase()}.`});
  S.pend=null;return Object.assign({},o,{fx:real});
}
// acciones financieras
function takeLoan(){if(!canBorrow())return false;S.gold+=150;S.debt+=150;return true}
function payDebt(){const p=Math.min(50,S.debt,Math.floor(S.gold));S.gold-=p;S.debt-=p;return p}
function issueBond(){if(!canBorrow())return false;const cpn=Math.max(.02,loanRate()-.015);S.bonds.push({amt:200,cpn,due:S.year+5});S.gold+=200;return cpn}
function printMoney(){if(S.stage<1||hasLaw('bancoCentral'))return false;S.gold+=50;S.issue+=50;return true}
function whyNot(k,i){
  const x=S.map[i],b=B[k];
  if(x.t==='rio')return 'No se puede construir sobre el río.';
  if(x.b)return 'Esa casilla ya está ocupada.';
  if(!b.ok.includes(x.t))return `${b.n}: ese terreno no sirve.`;
  if(b.hmin&&(x.h||0)<b.hmin)return `${b.n}: necesita ladera (terreno alto).`;
  if(b.river&&!nearRiver(i))return `${b.n}: debe estar junto al río.`;
  if(S.gold<cost(k))return `Te faltan ${cost(k)-Math.floor(S.gold)} de oro.`;
  return '';
}
function undoBuild(){
  const u=S.undo.pop();if(!u)return null;const x=S.map[u.i];x.b=null;S.gold+=u.paid;
  if(u.forest){x.t='bosque';S.env=clamp(S.env+3,0,100)}
  if(S.pop>cap())S.pop=cap();return u;
}
function build(k,i){
  const r=whyNot(k,i);if(r)return r;
  const x=S.map[i];S.gold-=cost(k);
  let msg='';
  if(x.t==='bosque'){x.t='llano';S.env=clamp(S.env-3,0,100);msg='Talaste bosque: el ambiente baja.'}
  S.undo.push({i,k,paid:cost(k),forest:x.t==='llano'&&!!msg});
  x.b=k;return msg||true;
}

function lawSlots(){return 1+S.stage}
function lawCostNow(){return Math.round(40*S.price)}
function lawBlock(l){
  if(l.st>S.stage)return `Se abre en ${STAGES[l.st].n}.`;
  if(l.no&&l.no.includes(S.reg))return `No es posible en ${RG().n}.`;
  if(!hasLaw(l.id)){
    if(Object.keys(S.laws).length>=lawSlots())return `Solo caben ${lawSlots()} leyes en esta etapa. Deroga una primero.`;
    if(S.gold<lawCostNow())return `Te faltan ${lawCostNow()-Math.floor(S.gold)} de oro.`;

<script>
// ---------- Sonido: río, pájaros y tiple (WebAudio, sin descargas) ----------
const Sound=(()=>{
  let ac=null,master=null,on=false,timer=null,next=0,bar=0,birdT=0;
  const NOTE=n=>440*Math.pow(2,(n-69)/12);
  const MODES={
    republica:{s:[64,67,69,71,74,76,79],b:[[40,47],[45,52],[47,54],[40,47]],beat:.62},
    monarquia:{s:[67,69,71,74,76,79,81],b:[[43,50],[48,55],[50,57],[43,50]],beat:.72},

    tirania:{s:[57,60,62,64,65,67,69],b:[[33,40],[33,40],[38,45],[40,47]],beat:.82},
    oligarquia:{s:[65,67,69,71,72,74,77],b:[[41,48],[43,50],[41,48],[36,43]],beat:.64},

    const len=ac.sampleRate*2,buf=ac.createBuffer(1,len,ac.sampleRate),d=buf.getChannelData(0);let l=0;
    for(let i=0;i<len;i++){const w=Math.random()*2-1;l=(l+.02*w)/1.02;d[i]=l*3.2}

// ---------- Vista del mapa: cámara, animación e interacción ----------

function chartSVG(series,opts){
  const h=S.hist;if(h.length<2)return '<p class="small">La historia se dibuja cuando pasen al menos dos años.</p>';
  const W=320,H=150,L=34,R=8,T=10,Bm=22;
  let lo=Infinity,hi=-Infinity;series.forEach(s=>h.forEach(p=>{lo=Math.min(lo,p[s.k]);hi=Math.max(hi,p[s.k])}));
  if(opts&&opts.fixed){lo=opts.fixed[0];hi=opts.fixed[1]}else{lo=Math.min(0,lo);hi=hi===lo?lo+1:hi*1.08}
  const X=i=>L+(W-L-R)*i/(h.length-1),Y=v=>T+(H-T-Bm)*(1-(v-lo)/(hi-lo));
  const fmt=v=>Math.abs(v)>=1000?(v/1000).toFixed(1)+'k':Math.round(v);
  let g=`<svg viewBox="0 0 ${W} ${H}" class="chart" role="img" aria-label="${series.map(s=>s.n).join(', ')}">`;
  [0,.5,1].forEach(f=>{const v=lo+(hi-lo)*f,y=Y(v);g+=`<line x1="${L}" x2="${W-R}" y1="${y}" y2="${y}" class="gl"/><text x="${L-4}" y="${y+3}" text-anchor="end" class="ax">${fmt(v)}</text>`});
  if(lo<0&&hi>0)g+=`<line x1="${L}" x2="${W-R}" y1="${Y(0)}" y2="${Y(0)}" class="zero"/>`;
  g+=`<text x="${L}" y="${H-5}" class="ax">Año ${h[0].y}</text><text x="${W-R}" y="${H-5}" text-anchor="end" class="ax">Año ${h[h.length-1].y}</text>`;
  series.forEach(s=>{g+=`<polyline fill="none" stroke="${s.c}" stroke-width="2" stroke-linejoin="round" points="${h.map((p,i)=>X(i).toFixed(1)+','+Y(p[s.k]).toFixed(1)).join(' ')}"/>`});
  g+='</svg><div class="legend">'+series.map(s=>`<span><i style="background:${s.c}"></i>${s.n}: ${fmt(h[h.length-1][s.k])}${s.u||''}</span>`).join('')+'</div>';
  return g;
}

    ${F.cpn?`<tr><td>Cupones de bonos</td><td>−${F.cpn}</td></tr>`:''}
    ${F.mat?`<tr><td>Vencimiento de bonos</td><td>−${F.mat}</td></tr>`:''}
    <tr class="tot"><td>Resultado del año</td><td class="${F.net<0?'neg':''}">${F.net>=0?'+':'−'}${Math.abs(F.net)}</td></tr>`;
  const cb=canBorrow()&&!S.over;
  $('loanB').disabled=!cb;$('bondB').disabled=!cb;
  $('printB').disabled=S.stage<1||S.over;
  $('payB').disabled=S.debt<=0||S.gold<1||S.over;
  $('bondList').textContent=S.bonds.length?'Bonos: '+S.bonds.map(b=>`${b.amt} al ${Math.round(b.cpn*100)}%, vence año ${b.due}`).join('; ')+'.':'';
  $('loanInfo').textContent=S.stage<1?'El crédito y la emisión se abren al llegar a Pueblo.':R.l==='CCC'?'Calificación CCC: nadie te presta. Reduce deuda y déficit.':'Préstamo: 150, se paga 15% por año. Bono: 200 a 5 años, interés más bajo, pagas todo al vencer.';
  $('endB').disabled=!!S.pend||S.over;
  $('endB').innerHTML=S.over?'Fin':`Año ${S.year}<br><small>terminar ▸</small>`;
  $('log').innerHTML=S.log.slice(0,40).map(l=>`<p><b>Año ${l.y}.</b> ${l.t}</p>`).join('');
}
MapView.onTap=i=>{
  if(S.over||S.pend)return;
  if(!tool&&document.querySelector('.sheet.open')){closeSheets();render();return}
  if(!tool){if(S.map[i].t!=='rio')tileInfo(i);return}
  const was=S.map[i].b,r=build(tool,i);
  if(S.map[i].b!==tool||was===tool){return toast(typeof r==='string'?r:'No se puede construir ahí.')}
  MapView.built(i);Sound.tap();if(typeof r==='string')toast(r);
  guideToast();save();render();
};
$('htabs').addEventListener('click',e=>{const b=e.target.closest('[data-c]');if(!b)return;chartKey=b.dataset.c;renderChart()});
$('tray').addEventListener('click',e=>{const t=e.target.closest('.tool');if(!t||t.disabled)return;tool=tool===t.dataset.k?null:t.dataset.k;render()});
$('cancelB').onclick=()=>{tool=null;render()};
['c','a','e'].forEach(k=>$('tx'+k).addEventListener('input',e=>{const want=+e.target.value,v=taxLimit(k,want);S.tx[k]=v;
  if(v!==want)toast(RM('eliteCap',0)&&k==='e'&&want>RM('eliteCap',0)?'La plutocracia no permite cobrar más de 10% a la élite.':'El Senado solo permite mover cada impuesto 5 puntos por año.');save();render()}));
$('loanB').onclick=()=>{if(takeLoan()){S.log.unshift({y:S.year,t:`Préstamo de 150 al ${Math.round(loanRate()*100)}%.`});save();render();toast('Recibiste 150 de oro.')}};
$('bondB').onclick=()=>{const c=issueBond();if(c){S.log.unshift({y:S.year,t:`Emitiste un bono de 200 al ${Math.round(c*100)}% a 5 años.`});save();render();toast('Recibiste 200. Pagarás cupones y el capital al vencer.')}};
$('printB').onclick=()=>{if(printMoney()){save();render();toast('Imprimiste 50 de oro. Los precios subirán el próximo año.')}};
$('payB').onclick=()=>{const p=payDebt();save();render();toast(`Abonaste ${p} a los préstamos.`)};
$('endB').onclick=endYear;
$('helpB').onclick=()=>help(false);
$('undoB').onclick=()=>{const u=undoBuild();if(u){MapView.razed(u.i);toast(`Deshiciste: ${B[u.k].n}. Recuperaste ${u.paid} de oro.`);save();render()}};
function slotInfo(n){try{const s=JSON.parse(localStorage.getItem('polis-slot-'+n));return s?`${STAGES[s.stage].n}, año ${s.year} (${DIFFS[s.diff||'normal'].n})`:null}catch(e){return null}}
function menu(){
  let got={};try{got=JSON.parse(localStorage.getItem('polis-logros')||'{}')}catch(e){}
  openCard(`<h3>Partidas</h3><p class="small">Código de este mapa: <b>${S.seed}</b>. Úsalo al iniciar para repetir el mismo territorio.</p>
    ${[1,2,3].map(n=>{const si=slotInfo(n);return `<div class="slot"><span>Ranura ${n}: ${si||'vacía'}</span><button class="btn" data-sv="${n}">Guardar</button><button class="btn" data-ld="${n}" ${si?'':'disabled'}>Cargar</button></div>`}).join('')}
    <div class="two" style="margin-top:8px"><button class="btn" id="expB">Copiar código de partida</button><button class="btn" id="impB">Pegar código</button></div>
    <textarea id="impT" class="inp" rows="3" placeholder="Pega aquí un código de partida" hidden></textarea>
    <h2 style="margin-top:14px">Logros (${Object.keys(got).length} de ${ACH.length})</h2>
    <div class="achs">${ACH.map(a=>`<div class="ach ${got[a.id]?'on':''}"><b>${got[a.id]?'🏅':'○'} ${a.n}</b><small>${a.d}</small></div>`).join('')}</div>
    <div class="two" style="margin-top:12px"><button class="btn" id="newG">Nueva partida</button><button class="main" id="okB" style="margin:0">Cerrar</button></div>`);
  $('okB').onclick=closeCard;
  card.querySelectorAll('[data-sv]').forEach(b=>b.onclick=()=>{try{localStorage.setItem('polis-slot-'+b.dataset.sv,JSON.stringify(S));toast('Partida guardada en la ranura '+b.dataset.sv+'.');menu()}catch(e){toast('No se pudo guardar.')}});
  card.querySelectorAll('[data-ld]').forEach(b=>b.onclick=()=>{try{S=JSON.parse(localStorage.getItem('polis-slot-'+b.dataset.ld));tool=null;save();render();closeCard();toast('Partida cargada.')}catch(e){toast('No se pudo cargar.')}});
  $('expB').onclick=()=>{const code=btoa(unescape(encodeURIComponent(JSON.stringify(S))));const done=()=>toast('Código copiado. Guárdalo donde quieras.');
    if(navigator.clipboard)navigator.clipboard.writeText(code).then(done,()=>{$('impT').hidden=false;$('impT').value=code;$('impT').select();toast('Copia el código del recuadro.')});else{$('impT').hidden=false;$('impT').value=code}};
  $('impB').onclick=()=>{const t=$('impT');if(t.hidden){t.hidden=false;t.value='';t.focus();return}
    try{const s=JSON.parse(decodeURIComponent(escape(atob(t.value.trim()))));if(!s.map||!s.tx)throw 0;S=s;tool=null;save();render();closeCard();toast('Partida cargada desde el código.')}catch(e){toast('Ese código no es válido.')}};
  $('newG').onclick=()=>{openCard(`<h3>¿Empezar de nuevo?</h3><p>Se pierde la partida actual si no la guardaste en una ranura.</p><div class="two"><button class="btn" id="noB">Seguir aquí</button><button class="btn" id="yesB">Nueva partida</button></div>`);$('noB').onclick=closeCard;$('yesB').onclick=()=>{closeCard();newGame()}};
}
$('newB').onclick=menu;
function soundUI(){$('sndB').textContent=Sound.on?'🔊':'🔇';$('sndB').setAttribute('aria-label',Sound.on?'Silenciar':'Activar sonido')}
$('sndB').onclick=()=>{if(Sound.on)Sound.stop();else Sound.start();try{localStorage.setItem('polis-sound',Sound.on?'1':'0')}catch(e){}soundUI()};
let wantSound=false;try{wantSound=localStorage.getItem('polis-sound')==='1'}catch(e){}
if(wantSound)document.addEventListener('pointerdown',function f(){if(!Sound.on){Sound.start();soundUI()}document.removeEventListener('pointerdown',f)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&ov.classList.contains('show')&&!S.pend&&!S.over)closeCard()});
try{localStorage.removeItem('polis-v1')}catch(e){}
function focusHome(){const i=S.map.findIndex(x=>x.b==='casa');if(i>=0)MapView.focus(i)}
function showCover(saved){
  $('cover').innerHTML=`<div class="cv-in"><h1 class="cv-t">Polis</h1><p class="cv-s">Gobierna un territorio junto al río.<br>Del pueblo, por el pueblo, para el pueblo.</p>
    <div class="cv-b">${saved?`<button class="main" id="cvC">Continuar: ${STAGES[S.stage].n}, año ${S.year}</button>`:''}<button class="${saved?'btn':'main'}" id="cvN">Nueva partida</button><button class="btn" id="cvH">Cómo jugar</button></div></div>`;
  $('cover').hidden=false;
  if(saved)$('cvC').onclick=()=>{hideCover();if(S.pend)showEvent()};
  $('cvN').onclick=()=>{hideCover();newGame()};
  $('cvH').onclick=()=>help(false);
}
function hideCover(){$('cover').hidden=true}
MapView.init();
if(load()){if(!S.diff){S.diff='normal';S.guide=false;S.gstep=GUIDE.length}if(!S.undo)S.undo=[];if(S.kept===undefined){S.kept=0;S.hungry=false}if(!S.seed)S.seed=0;if(!S.reg){S.reg='republica';S.corr=20}render();focusHome();showCover(!S.over)}else{freshState('normal');render();focusHome();showCover(false)}

</script>
</body>
</html>
