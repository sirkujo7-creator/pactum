<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pactum: prueba de estilo en acuarela</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alegreya:wght@700;800&family=Alegreya+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--paper:#ECEAE2;--ink:#2B2A25;--muted:#6A675C;--panel:rgba(250,248,242,.9);--line:#D5D0C2;--accent:#2D5D72;color-scheme:light}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--ink:#EDEAE0;--muted:#B5B1A4;--panel:rgba(30,34,32,.88);--line:#3E4440;--accent:#8CC1D6}}
:root[data-theme="dark"]{--ink:#EDEAE0;--muted:#B5B1A4;--panel:rgba(30,34,32,.88);--line:#3E4440;--accent:#8CC1D6}
:root{box-sizing:border-box}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0;overflow:hidden;background:var(--paper);font-family:"Alegreya Sans",system-ui,sans-serif;color:var(--ink)}
#cv{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab}
.glass{background:var(--panel);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid var(--line);border-radius:14px}
.title{position:fixed;left:12px;top:calc(12px + env(safe-area-inset-top,0px));padding:8px 14px 9px;z-index:2}
.title h1{font-family:Alegreya,Georgia,serif;font-weight:800;font-size:1.5rem;margin:0;line-height:1}
.title p{margin:3px 0 0;font-size:.85rem;color:var(--muted)}
.zoom{position:fixed;right:12px;top:calc(12px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;gap:6px;z-index:2}
.zoom button,.bar button{font:inherit;color:var(--ink);cursor:pointer}
.zoom button{width:40px;height:40px;border-radius:50%;font-size:1.15rem}
.bar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;flex-wrap:wrap;justify-content:center;gap:6px;padding:8px;z-index:2;width:min(620px,calc(100vw - 20px))}
.seg{display:flex;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{background:none;border:0;padding:7px 11px;font-size:.9rem}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
.bar>button{background:none;border:1px solid var(--line);border-radius:10px;padding:7px 12px;font-size:.9rem}
.sun{position:relative;height:4px;border-radius:2px;background:linear-gradient(90deg,#2B3A5A,#F2C46B 25%,#F7E7B0 50%,#E88A55 72%,#2B3A5A 88%);width:100%;margin-top:2px}
.sun::after{content:"";position:absolute;top:-4px;left:var(--p,30%);width:12px;height:12px;border-radius:50%;background:#FFF6D8;border:2px solid #E0A030;transform:translateX(-50%)}
.card{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(128px + env(safe-area-inset-bottom,0px));max-width:min(360px,90vw);padding:10px 14px;z-index:3;display:grid;gap:2px;cursor:pointer}
.card b{font-family:Alegreya,Georgia,serif;font-size:1.1rem}
.card span{font-size:.9rem;color:var(--muted)}
.card em{font-size:.95rem}
.leg{position:fixed;right:12px;top:calc(170px + env(safe-area-inset-top,0px));padding:10px 12px;z-index:2;font-size:.85rem;display:grid;gap:5px;max-width:230px}
.leg div{display:flex;align-items:center;gap:8px}
.leg i{width:14px;height:14px;border-radius:4px;flex:none}
.busy{position:fixed;left:50%;top:40%;transform:translate(-50%,-50%);padding:10px 16px;z-index:4;font-family:Alegreya,Georgia,serif}
[hidden]{display:none!important}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
@media(max-width:520px){.title h1{font-size:1.25rem}.seg button{padding:7px 9px}}
</style>
</head>
<body>
<canvas id="cv" aria-label="Territorio pintado en acuarela. Toca un poblador o un lugar para ver quién o qué es."></canvas>
<div class="title glass"><h1>Pactum</h1><p>Prueba de estilo: acuarela por capas</p></div>
<div class="zoom"><button class="glass" id="zin" aria-label="Acercar">+</button><button class="glass" id="zout" aria-label="Alejar">−</button><button class="glass" id="zfit" aria-label="Ver todo el territorio">⤢</button><button class="glass" id="legB" aria-label="Pisos térmicos">◐</button></div>
<div class="leg glass" id="leg" hidden>
  <b>Pisos térmicos</b>
  <div><i style="background:#D3BF83"></i>Bosque seco y arrozales, 300 a 1.200 m</div>
  <div><i style="background:#9DBA6C"></i>Ladera cafetera, 1.200 a 2.300 m</div>
  <div><i style="background:#6E9567"></i>Bosque de niebla, 2.300 a 3.000 m</div>
  <div><i style="background:#BDB47A"></i>Páramo, 3.000 a 3.700 m</div>
  <div><i style="background:#F1F1EC;border:1px solid #ccc"></i>Nevado, más de 4.300 m</div>
</div>
<div class="card glass" id="card" role="status" hidden></div>
<div class="busy glass" id="busy" hidden>Pintando el territorio…</div>
<div class="bar glass">
  <div class="seg" role="group" aria-label="Hora del día"><button data-tod="auto" aria-pressed="true">Día completo</button><button data-tod="manana" aria-pressed="false">Mañana</button><button data-tod="tarde" aria-pressed="false">Tarde</button><button data-tod="noche" aria-pressed="false">Noche</button></div>
  <div class="seg" role="group" aria-label="Temporada"><button data-dry="0" aria-pressed="true">Lluvias</button><button data-dry="1" aria-pressed="false">Sequía</button></div>
  <button id="otro">Otro territorio</button>
  <div class="sun" id="sunbar" aria-hidden="true"></div>
</div>
<script>
// ===== Núcleo: relieve, entornos y pueblo (sin gráficos) =====
const N=24,TW=64,TH=32,EL=15,WL=.36;
function mulberry(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function lerp(a,b,t){return a+(b-a)*t}
function smooth(t){return t*t*(3-2*t)}
function makeNoise(seed){
  const R=mulberry(seed),G=64,g=Array.from({length:G*G},()=>R());
  const at=(x,y)=>g[((y%G+G)%G)*G+((x%G+G)%G)];
  return (x,y)=>{const x0=Math.floor(x),y0=Math.floor(y),fx=smooth(x-x0),fy=smooth(y-y0);
    return lerp(lerp(at(x0,y0),at(x0+1,y0),fx),lerp(at(x0,y0+1),at(x0+1,y0+1),fx),fy)};
}
let W; // el mundo
function riverD(r,c,seed){ // distancia al cauce del río (curva que cruza la pantalla)
  const s=(c-r)/N, mid=riverMid(s,seed);
  return Math.abs((r+c)-mid)/Math.SQRT2;
}
function buildWorld(seed){
  const n1=makeNoise(seed),n2=makeNoise(seed+17),n3=makeNoise(seed+99);
  const hf=(r,c)=>{
    const u=c/N,v=r/N;
    const fbm=n1(u*3.2,v*3.2)*.55+n2(u*7,v*7)*.3+n3(u*14,v*14)*.15;
    const back=clamp(1-(u+v)/1.25,0,1);
    const peaks=n2(u*4.3+11,v*4.3+3);
    const ridge=Math.pow(back,1.5)*10.5*(0.55+0.75*peaks);
    let h=fbm*2.6+ridge+(1-back)*0.4;
    const d=riverD(r,c,seed);
    h-=2.3*Math.exp(-((d/1.7)**2));
    h+=0.9*Math.exp(-(((u-.78)**2+(v-.9)**2)/.02));
    return Math.max(0,h);
  };
  const H=[];
  for(let r=0;r<=N;r++)for(let c=0;c<=N;c++)H.push(hf(r,c));
  const hv=(r,c)=>H[r*(N+1)+c];
  const tiles=[];
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){
    const h00=hv(r,c),h01=hv(r,c+1),h11=hv(r+1,c+1),h10=hv(r+1,c);
    const h=(h00+h01+h11+h10)/4,sx=(h01+h11-h00-h10)/2,sy=(h10+h11-h00-h01)/2,slope=Math.hypot(sx,sy);
    const d=riverD(r+.5,c+.5,seed),moist=clamp(1.2-d/5,0,1)*.7+n3(c/5,r/5)*.5;
    let b;
    if(d<1.3&&h<2.2)b='agua';
    else if(h>9)b='nieve';
    else if(h>7.6||slope>2.4)b='roca';
    else if(h>6.1)b='paramo';
    else if(h>4.4)b='niebla';
    else if(h>2)b='ladera';
    else if(d<1.9)b='galeria';
    else if(d<6&&moist>.45&&slope<.45)b='arrozal';
    else if(moist<.5)b='seco';
    else b='potrero';
    tiles.push({r,c,h,h00,h01,h11,h10,sx,sy,slope,b,d,obj:null});
  }
  W={seed,H,hv,hf,tiles,objs:[],paths:[],vary:makeNoise(seed+55),moistAt:(r,c)=>clamp(1.2-riverD(r,c,seed)/5,0,1)*.7+n3(c/5,r/5)*.5};
  placeVillage();
  placeNature();
  return W;
}
function T(r,c){return (r>=0&&c>=0&&r<N&&c<N)?W.tiles[r*N+c]:null}
function heightAt(r,c){return W.hf(clamp(r,0,N),clamp(c,0,N))}
function flatish(t){return t&&t.b!=='agua'&&t.slope<.7&&t.h>WL+.1}
function placeVillage(){
  const R=mulberry(W.seed+5);
  // centro: terreno suave junto al río, ni muy alto ni en el cauce, cerca del centro de la pantalla
  let best=null,bs=1e9;
  for(const t of W.tiles){if(!flatish(t)||t.d<2.2||t.d>5||t.h>3.2)continue;const sc=Math.abs(t.r-N/2)+Math.abs(t.c-N/2)+t.slope*6;if(sc<bs){bs=sc;best=t}}
  if(!best)best=W.tiles.find(flatish);
  W.plaza=best;best.obj={k:'plaza'};best.plaza=true;
  const ps=side(best.r+.5,best.c+.5);const ring=[];for(let dr=-3;dr<=3;dr++)for(let dc=-3;dc<=3;dc++){if(!dr&&!dc)continue;const t=T(best.r+dr,best.c+dc);if(t&&flatish(t)&&!t.obj&&side(t.r+.5,t.c+.5)===ps)ring.push({t,d:Math.abs(dr)+Math.abs(dc)})}
  ring.sort((a,b)=>a.d-b.d+(R()-.5)*1.2);
  const plan=['fuente','kiosco','kiosco','casona','casona','taller','bahareque','bahareque','bahareque','bahareque','bahareque','bahareque','bahareque','bahareque'];
  // la fuente y los kioscos van en la plaza; lo demás alrededor
  best.obj={k:'plaza'};W.objs.push({k:'fuente',r:best.r+.5,c:best.c+.5});
  W.objs.push({k:'kiosco',r:best.r+.18,c:best.c+.82},{k:'kiosco',r:best.r+.82,c:best.c+.18});
  let i=0;W.houses=[];
  for(const k of plan.slice(3)){while(i<ring.length&&ring[i].t.obj)i++;if(i>=ring.length)break;const t=ring[i].t;t.obj={k};const o={k,r:t.r+.5,c:t.c+.5,v:Math.floor(R()*4)};W.objs.push(o);W.houses.push(o);i++}
  // campos: cafetales en ladera y arrozales en el valle, cerca del pueblo
  W.fields=[];
  for(const t of W.tiles){const dd=Math.abs(t.r-best.r)+Math.abs(t.c-best.c);if(t.obj||dd>9||side(t.r+.5,t.c+.5)!==ps)continue;
    if(t.b==='ladera'&&t.slope<1.1&&R()<.55){t.obj={k:'cafe'};W.fields.push(t)}
    else if(t.b==='arrozal'&&R()<.8){t.obj={k:'arroz'};W.fields.push(t)}}
  // caminos de tierra: de la plaza a cada casa y a algunos campos
  for(const o of W.houses)W.paths.push([[best.r+.5,best.c+.5],[o.r,o.c]]);
  W.fields.slice(0,6).forEach(f=>W.paths.push([[best.r+.5,best.c+.5],[f.r+.5,f.c+.5]]));
}
function placeNature(){
  const R=mulberry(W.seed+9);
  const add=(k,t,n,sc)=>{for(let j=0;j<n;j++)W.objs.push({k,r:t.r+.15+R()*.7,c:t.c+.15+R()*.7,s:(sc||1)*(.85+R()*.3),v:Math.floor(R()*3)})};
  for(const t of W.tiles){
    if(t.obj||t.plaza)continue;
    const p=R();
    switch(t.b){
      case 'galeria':add('arbol',t,p<.7?2:1);if(p<.35)add('guadua',t,1);break;
      case 'seco':if(p<.45)add('saman',t,1);else if(p<.6)add('arbusto',t,2);break;
      case 'potrero':if(p<.12)add('arbol',t,1);else if(p<.3)add('vaca',t,1);break;
      case 'arrozal':if(p<.15)add('garza',t,1);break;
      case 'ladera':if(p<.25)add('platano',t,1);else if(p<.42)add('guadua',t,1);else if(p<.5)add('palma',t,1);else if(p<.65)add('arbol',t,1,.9);break;
      case 'niebla':add('niebla',t,p<.6?3:2);if(p<.18)add('palma',t,1,1.1);break;
      case 'paramo':if(p<.75)add('frailejon',t,p<.4?3:2);if(p>.9)add('piedra',t,1);break;
      case 'roca':if(p<.35)add('piedra',t,1);break;
    }
  }
}
const BIOMA={agua:{n:'Río',p:'Agua'},galeria:{n:'Bosque de galería',p:'Cálido'},arrozal:{n:'Llanura arrocera',p:'Cálido'},seco:{n:'Bosque seco tropical',p:'Cálido'},potrero:{n:'Potrero',p:'Cálido'},
  ladera:{n:'Ladera cafetera',p:'Templado'},niebla:{n:'Bosque de niebla',p:'Frío'},paramo:{n:'Páramo',p:'Páramo'},roca:{n:'Roca de alta montaña',p:'Glacial'},nieve:{n:'Nevado',p:'Glacial'}};
function metros(h){return Math.round((300+h*450)/50)*50}
function riverMid(s,seed){return N*1.08+2.6*Math.sin(s*Math.PI*1.6+seed%7)+1.2*Math.sin(s*Math.PI*4.1+seed%3)}
function side(r,c){const s=(c-r)/N;return Math.sign((r+c)-riverMid(s,W.seed))}

// ===== Arte en acuarela por capas =====
const PADX=60,TOPM=190,WWd=N*TW+PADX*2,WHd=N*TH+TOPM+170,OX=WWd/2,OY=TOPM;
function P(r,c,h){return [OX+(c-r)*TW/2,OY+(c+r)*TH/2-h*EL]}
function rgb(h){h=h.replace('#','');return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]}
function hex(a){return '#'+a.map(v=>Math.round(clamp(v,0,255)).toString(16).padStart(2,'0')).join('')}
function shade(h,f){const c=rgb(h);return hex(c.map(v=>f<0?v*(1+f):v+(255-v)*f))}
function mix(a,b,t){const x=rgb(a),y=rgb(b);return hex(x.map((v,i)=>v+(y[i]-v)*t))}
function poly(g,pts){g.beginPath();pts.forEach((p,i)=>i?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1]));g.closePath()}
function wash(g,pts,col,rng,al,j){al=al===undefined?.9:al;j=j===undefined?1.4:j;
  for(let k=0;k<3;k++){g.globalAlpha=k?al*.35:al;g.fillStyle=k===2?shade(col,-.07):k===1?shade(col,.06):col;poly(g,pts.map(p=>[p[0]+(rng()-.5)*j*(k?1:0),p[1]+(rng()-.5)*j*(k?1:0)]));g.fill()}
  g.globalAlpha=1}
function blob(g,x,y,rx,ry,col,rng,al){for(let k=0;k<3;k++){g.globalAlpha=(al||.9)*(k?.45:1);g.fillStyle=k===1?shade(col,.1):k===2?shade(col,-.08):col;g.beginPath();g.ellipse(x+(rng()-.5)*rx*.25,y+(rng()-.5)*ry*.25,rx*(.9+rng()*.18),ry*(.9+rng()*.18),0,0,Math.PI*2);g.fill()}g.globalAlpha=1}
function edgeStroke(g,pts,col,al,w){g.globalAlpha=al;g.strokeStyle=col;g.lineWidth=w||.8;g.lineJoin='round';poly(g,pts);g.stroke();g.globalAlpha=1}

// --- colores del terreno según entorno y temporada ---
const GROUND={agua:'#7DB0C6',galeria:'#86AE66',arrozal:'#A9CB84',seco:'#D1BE82',potrero:'#B8C67E',ladera:'#9DBA6C',niebla:'#6E9567',paramo:'#BDB47A',roca:'#9A938A',nieve:'#F3F2EC'};
const DRYC='#D5B878';
function groundColor(t,dry){let c=GROUND[t.b];if(t.b==='agua')return mix('#C8BA8E',DRYC,dry*.3);if(['galeria','arrozal','potrero','ladera','niebla'].includes(t.b))c=mix(c,DRYC,dry*(t.b==='niebla'?.25:.45));if(t.b==='seco')c=mix(c,'#D9B56C',dry*.4);
  if(t.b!=='nieve'&&t.b!=='roca'&&t.h>8.4)c=mix(c,'#F3F2EC',clamp((t.h-8.4)/1.4,0,.7));return c}
function band(h,edges,cols){ // mezcla suave entre bandas de altura
  for(let i=0;i<edges.length;i++){const e=edges[i];if(h<e-.35)return cols[i];if(h<e+.35)return mix(cols[i],cols[i+1],smooth((h-(e-.35))/.7))}return cols[cols.length-1]}
function colorAt(r,c,h,slope,dry){
  const m=W.moistAt(r,c);
  const low=mix(mix('#D3BF83','#B9C67E',smooth(clamp((m-.35)/.3,0,1))),'#8DB36B',smooth(clamp((m-.75)/.25,0,1)));
  const lowD=mix(low,'#D6B878',dry*.45);
  let col=band(h,[2,4.4,6.1,7.6,9],[lowD,mix('#9DBA6C',DRYC,dry*.4),mix('#6E9567',DRYC,dry*.15),'#BDB47A','#9A938A','#F1F1EC']);
  if(slope>1.6&&h>2)col=mix(col,'#9A938A',clamp((slope-1.6)/1.2,0,.8));
  return col}
function light(t){return clamp(1+.2*t.sx-.17*t.sy,.62,1.3)}

function paintTerrain(g,mk,opt){
  const dry=opt.dry,rngB=mulberry(W.seed*3+1);
  g.setTransform(opt.scale,0,0,opt.scale,0,0);
  g.fillStyle=opt.paper;g.fillRect(0,0,WWd,WHd);
  // cielo y cordillera lejana
  const sky=g.createLinearGradient(0,0,0,OY+120);sky.addColorStop(0,'rgba(118,160,186,.42)');sky.addColorStop(1,'rgba(118,160,186,0)');g.fillStyle=sky;g.fillRect(0,0,WWd,OY+140);
  const far=(pts,col,al)=>{const q=g.createLinearGradient(0,OY-160,0,OY+80);q.addColorStop(0,col);q.addColorStop(1,'rgba(236,234,226,0)');g.globalAlpha=al;g.fillStyle=q;poly(g,pts);g.fill();g.globalAlpha=1};
  far([[0,OY+60],[0,OY-20],[WWd*.1,OY-50],[WWd*.22,OY-30],[WWd*.35,OY-80],[WWd*.47,OY-45],[WWd*.6,OY-70],[WWd*.75,OY-38],[WWd*.9,OY-66],[WWd,OY-40],[WWd,OY+60]],'rgba(140,166,170,.8)',.8);
  const nx=WWd*.3,nt=OY-150;
  far([[nx-230,OY+40],[nx-60,nt+30],[nx-18,nt+6],[nx+10,nt],[nx+60,nt+22],[nx+250,OY+40]],'rgba(150,170,186,.9)',.85);
  wash(g,[[nx-78,nt+42],[nx-60,nt+30],[nx-18,nt+6],[nx+10,nt],[nx+60,nt+22],[nx+84,nt+40],[nx+44,nt+34],[nx+14,nt+46],[nx-20,nt+36],[nx-46,nt+48]],'#FBFBF8',rngB,.92,1);
  // costados del diorama (tierra con estratos)
  const base=-2.2,L=[],R=[];
  for(let k=0;k<=N;k++){L.push(P(N,k,W.hv(N,k)));R.push(P(N-k,N,W.hv(N-k,N)))}
  const sideL=L.concat(L.slice().reverse().map(p=>[p[0],P(N,0,base)[1]+(p[0]-P(N,0,0)[0])*.5])),sideR=R.concat(R.slice().reverse().map(p=>[p[0],P(N,N,base)[1]-(p[0]-P(N,N,0)[0])*.5]));
  g.globalAlpha=.12;g.fillStyle='#3A3020';g.beginPath();g.ellipse(P(N,N,0)[0],P(N,N,base)[1]+14,WWd*.44,26,0,0,Math.PI*2);g.fill();g.globalAlpha=1;
  wash(g,sideL,'#9E805C',rngB,.97,0);wash(g,sideR,'#7D6347',rngB,.97,0);
  [[.35,'#B69770'],[.7,'#6C543C']].forEach(([f,col])=>{g.globalAlpha=.4;g.strokeStyle=col;g.lineWidth=1.3;g.beginPath();for(let k=0;k<=N;k++){const p=P(N,k,W.hv(N,k)*(1-f)+base*f);k?g.lineTo(p[0],p[1]):g.moveTo(p[0],p[1])}for(let k=0;k<=N;k++){const p=P(N-k,N,W.hv(N-k,N)*(1-f)+base*f);g.lineTo(p[0],p[1])}g.stroke()});g.globalAlpha=1;
  // teselas de la malla, de atrás hacia adelante
  const order=W.tiles.slice().sort((a,b)=>(a.r+a.c)-(b.r+b.c));
  for(const t of order){

  if(night>0){ctx.fillStyle=`rgba(16,26,52,${.55*night})`;ctx.fillRect(0,0,Wc,Hc);ctx.save();ctx.setTransform(dpr*cam.s,0,0,dpr*cam.s,dpr*cam.x,dpr*cam.y);
    for(const it of list){const o=it.o;if(!o)continue;if(o.k.startsWith('bahareque')||o.k==='casona'){ctx.globalAlpha=night*.9;ctx.fillStyle='#FFD88A';ctx.beginPath();ctx.arc(it.x-10,it.y-10,1.6,0,Math.PI*2);ctx.fill()}}ctx.restore();
    for(let k=0;k<50;k++){const r=mulberry(k*77);ctx.globalAlpha=night*r();ctx.fillStyle='#fff';ctx.fillRect(r()*Wc,r()*Hc*.35,1.3,1.3)}ctx.globalAlpha=1}
  const sb=$('sunbar');if(sb)sb.style.setProperty('--p',(d*100).toFixed(1)+'%');
}
function fitAll(){const s=Math.min(Wc/(WWd-80),Hc/(WHd-120));cam.s=s;cam.x=(Wc-WWd*s)/2;cam.y=(Hc-WHd*s)/2}
function focusVillage(){const p=P(W.plaza.r+.5,W.plaza.c+.5,W.plaza.h);cam.s=clamp(Math.max(Wc/470,1.5),.3,3.4);cam.x=Wc/2-p[0]*cam.s;cam.y=Hc*.52-p[1]*cam.s}
function zoomAt(f,px,py){const s0=Math.min(Wc/WWd,Hc/WHd)*.8,s2=clamp(cam.s*f,s0,3.6),k=s2/cam.s;cam.x=px-(px-cam.x)*k;cam.y=py-(py-cam.y)*k;cam.s=s2}
function pickTile(px,py){const wx=(px-cam.x)/cam.s,wy=(py-cam.y)/cam.s;let best=null,bd=1e9;for(const t of W.tiles){const p=P(t.r+.5,t.c+.5,t.h),d=Math.abs(wx-p[0])/(TW/2)+Math.abs(wy-p[1])/(TH/2);if(d<1&&(t.r+t.c)>(best?best.r+best.c:-1)){best=t}}return best}
function pickPerson(px,py){const wx=(px-cam.x)/cam.s,wy=(py-cam.y)/cam.s;let best=null,bd=14;for(const q of people){if(q.hidden)continue;const p=P(q.r,q.c,heightAt(q.r,q.c)),d=Math.hypot(wx-p[0],wy-(p[1]-9));if(d<bd){bd=d;best=q}}return best}
const OFICIO={campesino:'Campesino',campesina:'Campesina',artesano:'Artesano',elite:'Comerciante',nino:'Estudiante'};
function info(px,py){
  const q=pickPerson(px,py);
  if(q){$('card').innerHTML=`<b>${q.nombre}, ${q.edad} años</b><span>${OFICIO[q.type]}${q.type==='campesino'||q.type==='campesina'?' del valle':''}</span><em>“${q.piensa}”</em>`;$('card').hidden=false;return}
  const t=pickTile(px,py);if(!t){$('card').hidden=true;return}
  const B=BIOMA[t.b];$('card').innerHTML=`<b>${B.n}</b><span>Piso térmico: ${B.p}. Unos ${metros(t.h).toLocaleString('es-CO')} m de altura.</span>`;$('card').hidden=false;
}
function bind(){
  const pts=new Map();let st=null,pinch=null;const pos=e=>{const b=cv.getBoundingClientRect();return [e.clientX-b.left,e.clientY-b.top]};
  cv.addEventListener('pointerdown',e=>{cv.setPointerCapture(e.pointerId);pts.set(e.pointerId,pos(e));if(pts.size===1)st={p:pos(e),cx:cam.x,cy:cam.y,t:Date.now(),d:0};if(pts.size===2){const [a,b]=[...pts.values()];pinch={d:Math.hypot(a[0]-b[0],a[1]-b[1]),s:cam.s};st=null}});
  cv.addEventListener('pointermove',e=>{if(!pts.has(e.pointerId))return;const p=pos(e);pts.set(e.pointerId,p);if(pts.size===2&&pinch){const [a,b]=[...pts.values()];zoomAt(pinch.s*Math.hypot(a[0]-b[0],a[1]-b[1])/pinch.d/cam.s,(a[0]+b[0])/2,(a[1]+b[1])/2);return}if(st){const dx=p[0]-st.p[0],dy=p[1]-st.p[1];st.d=Math.max(st.d,Math.hypot(dx,dy));if(st.d>6){cam.x=st.cx+dx;cam.y=st.cy+dy}}});
  const end=e=>{if(st&&pts.size===1&&st.d<=6&&Date.now()-st.t<600)info(...pos(e));pts.delete(e.pointerId);if(pts.size<2)pinch=null;if(!pts.size)st=null};
  cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',e=>{pts.delete(e.pointerId);st=null;pinch=null});
  cv.addEventListener('wheel',e=>{e.preventDefault();const p=pos(e);zoomAt(e.deltaY<0?1.12:1/1.12,...p)},{passive:false});
  $('zin').onclick=()=>zoomAt(1.25,Wc/2,Hc/2);$('zout').onclick=()=>zoomAt(1/1.25,Wc/2,Hc/2);$('zfit').onclick=fitAll;
  document.querySelectorAll('[data-tod]').forEach(b=>b.onclick=()=>{tod=b.dataset.tod;document.querySelectorAll('[data-tod]').forEach(x=>x.setAttribute('aria-pressed',x===b));});
  document.querySelectorAll('[data-dry]').forEach(b=>b.onclick=()=>{if(busy)return;dry=+b.dataset.dry;document.querySelectorAll('[data-dry]').forEach(x=>x.setAttribute('aria-pressed',x===b));paint()});
  $('otro').onclick=()=>{if(busy)return;newWorld(Math.floor(Math.random()*899999)+1000);setTimeout(focusVillage,60)};
  $('legB').onclick=()=>{$('leg').hidden=!$('leg').hidden};
  $('card').onclick=()=>{$('card').hidden=true};
}
function resize(){dpr=Math.min(window.devicePixelRatio||1,2);Wc=cv.clientWidth;Hc=cv.clientHeight;cv.width=Wc*dpr;cv.height=Hc*dpr}
let last=0;function loop(t){const dt=Math.min(.05,(t-last)/1000||0);last=t;if(W)step(dt);draw(t);requestAnimationFrame(loop)}
function start(){cv=$('cv');ctx=cv.getContext('2d');resize();new ResizeObserver(resize).observe(cv);bakePeople(mk);newWorld(4242);setTimeout(focusVillage,60);bind();requestAnimationFrame(loop)}
start();

</script>
